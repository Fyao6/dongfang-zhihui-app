argin:20px 0}.review-menu h1 em{font-style:normal;color:var(--clay)}.review-intro{font-size:13px;line-height:1.9;color:var(--muted);margin:18px 0 24px}.review-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:286px;overflow:auto;scrollbar-width:thin;scrollbar-color:#53604d transparent;padding:2px}.review-links button{min-height:39px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:11px;padding:8px 9px;text-align:left;color:var(--muted)}.review-links button:hover{background:#252b23;color:var(--ink)}.review-links button.active{border-color:#6a8157;color:var(--clay);background:#242d1f}.review-note{margin-top:25px;padding-top:18px;border-top:1px solid var(--line);font-size:10px;line-height:1.9;color:var(--muted)}.bank-admin-dialog{padding:0;border:1px solid var(--line);border-radius:16px;width:96vw;max-width:1240px;height:92vh;max-height:1000px;background:var(--bg);overflow:hidden}.bank-admin-dialog::backdrop{background:#0008}.bank-admin-top{height:52px;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;font-size:12px;border-bottom:1px solid var(--line)}.bank-admin-top button{background:#252b23;border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:12px}.bank-admin-dialog iframe{width:100%;height:calc(100% - 52px);border:0;display:block}@media(max-height:950px) and (min-width:901px){.phone{width:357px;height:764px}.review-layout{grid-template-columns:minmax(0,1fr) 380px;gap:60px;padding-top:24px;padding-bottom:24px}.review-menu h1{font-size:39px}}@media(min-width:760px) and (max-width:900px){.review-layout{grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:22px 26px}.review-menu h1{font-size:32px}.review-links{max-height:250px}.review-links button{font-size:10px;min-height:36px;padding:7px}.review-intro{font-size:12px}.phone{height:min(720px,calc(100dvh - 130px));width:min(337px,calc((100dvh - 130px)*403/862));border-radius:30px}.review-note{font-size:9px}}@media(max-width:759px){.review-header{padding:17px 22px}.review-layout{grid-template-columns:1fr;gap:32px;padding:24px 20px 40px}.review-stage{grid-column:1;grid-row:1}.review-menu{grid-column:1;grid-row:2;max-width:500px;margin:auto;width:100%}.review-menu h1{font-size:32px}.phone{width:403px;height:862px}}@media(max-width:450px){.review-header{padding:15px 16px}.review-header b{font-size:16px}.review-header span{font-size:8px}.review-controls{gap:7px}.review-controls label{font-size:0;gap:0}.review-controls select{font-size:10px;padding:6px}.review-layout{padding:18px 10px 35px}.phone{width:100%;max-width:403px;height:auto;aspect-ratio:403/862;border-width:4px;border-radius:28px}.review-menu{padding:0 13px}}

:root{--bg:#f7f3e9;--ink:#273d32;--muted:#5e6d5f;--line:#d2d9c9;--clay:#385f4c;color-scheme:light}.review-controls select{background:#fffdf7;color:var(--ink);border-color:var(--line)}.phone{background:#f7f3e9;border-color:#b1baa7;box-shadow:0 18px 55px #3c57351a}.review-menu h1{font-family:'Songti SC','SimSun',Georgia,serif;font-weight:500;letter-spacing:.06em}.review-header b{font-family:'Songti SC','SimSun',serif;letter-spacing:.12em;font-size:22px}.review-eyebrow{color:#806944}.review-links button{border-color:var(--line);border-radius:8px}.review-links button.active{background:#e9eddf;border-color:#8a9f82;color:#385f4c}.review-links button:hover{background:#e9eddf;color:#273d32}
</style></head><body><header class="review-header"><div><b>东方智慧学院</b><span>EASTERN WISDOM ACADEMY</span></div><div class="review-controls"><label>语言<select id="review-language"><option value="zh">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="bo">བོད་ཡིག</option></select></label><label>外观<select id="review-mode"><option value="day">日间</option><option value="night" selected>夜间</option><option value="auto">自动</option></select></label></div></header><main class="review-layout"><section class="review-stage"><div class="phone" id="phone"><iframe id="experience-frame" title="东方智慧学院完整交互体验" allow="autoplay"></iframe></div></section><aside class="review-menu"><div class="review-eyebrow">EASTERN WISDOM · DAILY COMPANION</div><h1>与自己，<br><em>重新连接。</em></h1><p class="review-intro">东方意境，与现代身心科技相遇。<br>认识自己，修复身心，把成长融入日常。</p><div class="review-links" id="review-links"></div><p class="review-note">玄流 · 数字山水体验版 · 公网演示<br>首页在五项快捷功能行结束。计时自动累计，可隐藏与拖动。<br>社群发布、审核、对话及内容配置由云端服务管理；AI与设备需要正式接入配置。<br>独立体验：/experience　管理后台：/admin</p></aside></main><script></script><script>const preview=document.getElementById('experience-frame');
const requestedMemberPage=new URLSearchParams(location.search).get('page');
const requestedLanguage=new URLSearchParams(location.search).get('lang');
let savedReviewLanguage='zh';try{savedReviewLanguage=JSON.parse(localStorage.getItem('eastern-wisdom-r4')||'{}').lang||'zh';}catch{} 
let previewState={lang:({'zh-Hans':'zh','zh-CN':'zh','zh-TW':'zh-Hant'}[requestedLanguage]||(['zh','zh-Hant','en','bo'].includes(requestedLanguage)?requestedLanguage:savedReviewLanguage)),mode:'night'},previewPage=['membership','memberCenter','profile'].includes(requestedMemberPage)?requestedMemberPage:'home';
preview.src="/experience?mode=night&lang="+encodeURIComponent(previewState.lang)+"&page="+encodeURIComponent(previewPage);
const previewPages=[['home','首页'],['gate','三大地图'],['lifeResult','认识自己'],['body','修复自己'],['mind','提升自己'],['academy','智慧馆'],['service','AI服务'],['serviceReports','基础报告解析'],['community','社群'],['teachers','老师一对一'],['friends','好友与交流'],['communityInbox','我的对话'],['dailyCard','每日抽卡'],['checkin','每日签到'],['music','冥想音乐'],['favorites','我的收藏'],['growth','成长记录'],['timeline','每日时间轴'],['profile','我的']];
const pageLinks=document.getElementById('review-links');
previewPages.push(['timeBank','计时记录'],['membership','会员服务'],['memberCenter','会员中心']);
previewPages.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.dataset.page=id;b.classList.toggle('active',id===previewPage);pageLinks.append(b);});
function previewSend(){preview.contentWindow?.postMessage({type:'ew-settings',...previewState,page:previewPage},'*');}
pageLinks.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){previewPage=b.dataset.page;previewSend();}});
document.getElementById('review-language').addEventListener('change',e=>{previewState.lang=e.target.value;previewSend();});
document.getElementById('review-mode').addEventListener('change',e=>{previewState.mode=e.target.value;previewSend();});
window.addEventListener('message',e=>{if(e.source!==preview.contentWindow||e.data?.type!=='ew-state')return;previewPage=e.data.page;previewState.lang=e.data.lang;previewState.mode=e.data.mode;document.getElementById('review-language').value=previewState.lang;document.getElementById('review-mode').value=previewState.mode;pageLinks.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===previewPage));});
new ResizeObserver(entries=>{for(const {target} of entries)target.style.setProperty('--zoom',target.clientWidth/393);}).observe(document.getElementById('phone'));

</script></body></html>
