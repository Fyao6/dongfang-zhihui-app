function works(){const list=filteredWorks();return head('内容管理','管理本人作品、审核进度与APP内的实际表现。','<button class="btn" data-do="new">'+icon('plus')+'发布作品</button>')+'<div class="section-tabs">'+[['all','全部作品'],['video','视频'],['article','图文'],['course','课程']].map(([t,n])=>'<button data-work-type="'+t+'" aria-pressed="'+(state.workType===t)+'">'+n+' <small>('+state.works.filter(w=>t==='all'||w.type===t).length+')</small></button>').join('')+'</div><div class="filterbar"><div class="filters"><select class="control" id="work-status" aria-label="审核状态">'+[['all','全部状态'],['draft','草稿'],['reviewing','审核中'],['published','已发布'],['rejected','未通过']].map(([s,n])=>'<option value="'+s+'" '+(state.filter===s?'selected':'')+'>'+n+'</option>').join('')+'</select><select class="control" id="work-date" aria-label="创建日期">'+[['all','全部日期'],['7','近7天'],['30','近30天'],['90','近90天']].map(([s,n])=>'<option value="'+s+'" '+(state.workDate===s?'selected':'')+'>'+n+'</option>').join('')+'</select><select class="control" id="work-sort" aria-label="作品排序">'+[['latest','最新创建'],['oldest','最早创建'],['plays','播放量最高']].map(([s,n])=>'<option value="'+s+'" '+(state.workSort===s?'selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="row" style="flex-wrap:nowrap;min-width:0"><label class="search-wrap">'+icon('search')+'<input class="search" id="search" type="search" placeholder="搜索作品" aria-label="搜索作品标题" value="'+esc(state.query)+'"></label><button class="btn secondary small" data-export="works">'+icon('download')+'导出数据</button></div></div><div id="work-results">'+(list.length?workTable(list):empty(state.works.length?'没有匹配的作品':'还没有作品',state.works.length?'尝试调整体裁、日期或审核状态。':'先保存一份草稿，让你的分享从这里开始。','<button class="btn small" data-do="new">新建作品</button>'))+'</div><div class="list-foot"><span>共 '+list.length+' 份作品 · 数据周期：近'+state.days+'天</span><span>已发布作品修改后将重新审核</span></div>'}
function analytics(){const v=state.analytics?.totals||{},key=state.chartMetric,d=metricDefs[key],rows=(state.analytics?.works||[]).filter(w=>state.analyticsType==='all'||w.type===state.analyticsType).slice().sort((a,b)=>(b.plays||0)-(a.plays||0));const rate=v.plays?Math.min(100,(v.completions||0)/v.plays*100).toFixed(1)+'%':'—',avg=v.plays?num((v.watchSeconds||0)/v.plays):'—';return head('数据中心','APP账号数据 · 统计周期：'+rangeText()+' · 北京时间', '<div class="row">'+dateRange()+'<button class="btn secondary small" data-export="analytics">'+icon('download')+'导出数据</button></div>')+'<section class="panel"><div class="panel-title"><h2>数据总览</h2><button class="link" data-help="data">数据指标说明 '+icon('help')+'</button></div><div class="analytics-metrics">'+['plays','views','impressions','likes','favorites','followers'].map(k=>metricTile(k,true)).join('')+'</div><div class="analytics-overview"><div>'+chart(true)+'<div class="metric-grid">'+['watchSeconds','completions','learners','profileViews','shares','consultations'].map(k=>metricTile(k)).join('')+'</div></div><aside class="metric-analysis"><h3>'+d[0]+'分析</h3><div class="big-value">'+num(totalFor(key))+' <span style="font-size:12px;font-weight:400">'+d[1]+'</span></div><p>'+d[2]+'<br>'+(totalFor(key)?'你可以结合下方作品表现，回看哪些内容获得了更多连接。':'这个周期还没有记录到该项活动。发布作品后，可以在这里持续观察变化。')+'</p><small>数据来自 APP 内真实活动</small></aside></div><div class="data-summary-row"><div class="summary-stat"><span>平均观看时长</span><b>'+avg+'</b><small>秒 / 次播放</small></div><div class="summary-stat"><span>完整观看率</span><b>'+rate+'</b></div><div class="summary-stat"><span>APP当前关注人数</span><b>'+num(v.followers)+'</b><small>人</small></div><div class="summary-stat"><span>收到咨询</span><b>'+num(v.consultations)+'</b><small>条</small></div></div></section><section class="panel"><div class="panel-title"><h2>作品数据<span class="caption">近'+state.days+'天 · 按播放量排序</span></h2><div class="row"><select class="control" id="analytics-type" aria-label="数据作品类型">'+[['all','全部类型'],...Object.entries(types)].map( document.addEventListener('dragleave',e=>{const zone=e.target.closest('.dropzone');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('dragging')});
document.addEventListener('drop',e=>{const zone=e.target.closest('.dropzone');if(!zone)return;e.preventDefault();zone.classList.remove('dragging');const input=zone.querySelector('[data-upload]');if(input)busy(input,()=>uploadFile(e.dataTransfer.files?.[0],input))});
document.addEventListener('submit',e=>{const form=e.target;if(!['login-form','profile-form','work-form','appeal-form'].includes(form.id))return;e.preventDefault();if(form.id==='login-form'&&creatorAuthPending)return;const epoch=creatorIdentityEpoch,button=e.submitter,fd=new FormData(form),data=Object.fromEntries(fd),err=form.querySelector('.statusline');if(err)err.textContent='';formBusy(form,async()=>{try{
if(form.id==='login-form'){creatorAuthPending=true;try{await api('/api/auth/'+(state.authMode==='register'?'register':'login'),'POST',data);creatorIdentityChanged(true);await load().catch(creatorLoadError)}finally{creatorAuthPending=false}}
if(form.id==='profile-form'){await api(form.dataset.apply==='true'?'/api/creator/apply':'/api/creator/profile',form.dataset.apply==='true'?'POST':'PATCH',{displayName:data.displayName,bio:data.bio,avatarUrl:data.avatarUrl});if(epoch!==creatorIdentityEpoch)return;await load();if(epoch!==creatorIdentityEpoch)return;toast(form.dataset.apply==='true'?'申请已提交':'资料已保存')}
if(form.id==='work-form'){const w=state.editing,d={...data,duration:Number(data.duration)||0,categoryIds:fd.getAll('categoryIds'),sections:[...form.querySelectorAll('.section-row')].map(el=>[el.querySelector('[data-section-title]').value,el.querySelector('[data-section-title-en]').value,el.querySelector('[data-section-body]').value,el.querySelector('[data-section-body-en]').value])};delete d.submitAfter;if(w.id)d.version=w.version;const r=await api('/api/creator/works'+(w.id?'/'+encodeURIComponent(w.id):''),w.id?'PATCH':'POST',d);if(epoch!==creatorIdentityEpoch)return;rememberWork(r.item);if(button?.name==='submitAfter'){try{await submit(r.item)}catch(error){error.message='草稿已保存，提交审核未完成：'+error.message;throw error}}else await finishWork('草稿已保存')}
if(form.id==='appeal-form'){const w=work(form.dataset.id);await api('/api/creator/works/'+encodeURIComponent(w.id)+'/appeal','POST',{version:w.version,reason:data.reason});if(epoch!==creatorIdentityEpoch)return;$('#dialog').close();if(!await refreshWorks())return;render();toast('已提交人工复核')}
}catch(ex){if(err)err.textContent=ex.message;throw ex}})});
window.addEventListener('storage',event=>{if(event.key!=='ew-identity-change-v1')return;creatorIdentityChanged();load().catch(creatorLoadError)});
load().catch(creatorLoadError);
</script></body></html>
