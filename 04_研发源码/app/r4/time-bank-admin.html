<style>

mall{font-size:12px;min-height:33px;padding:6px 11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat{padding:21px;background:var(--card);border:1px solid var(--line);border-radius:15px}.stat strong{font-size:29px;display:block}.stat span{font-size:12px;color:var(--muted)}.editor-layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(340px,1fr);gap:21px;align-items:start}.table-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}td,th{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}th{background:#e8f0f2;font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}td .actions{min-width:125px}.badge{display:inline-block;padding:3px 8px;border-radius:7px;font-size:10px;background:var(--soft);white-space:nowrap}.badge.pending{background:#fcf0d9;color:#82621e}.badge.rejected{background:#fff0ec;color:#9a4e39}.grid-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid-form label{font-size:12px;display:block}.grid-form .wide{grid-column:1/-1}input,select,textarea{display:block;width:100%;min-height:40px;background:#fff;border:1px solid #cddcdf;border-radius:9px;padding:9px 11px;margin-top:5px;max-width:100%}textarea{resize:vertical;min-height:80px}input[type=checkbox]{display:inline-block;width:17px;min-height:17px;margin:0 7px 0 0;vertical-align:middle}input[type=file]{font-size:11px}.inline-check{display:flex!important;align-items:center;gap:6px}.error{color:#a13b2b;white-space:pre-wrap;font-size:12px;margin-top:11px}.notice{position:fixed;bottom:20px;right:25px;max-width:min(460px,90vw);border-radius:13px;padding:13px 20px;background:#173f44;color:#fff;box-shadow:0 8px 30px #05252a22;z-index:50}.notice:empty{display:none}.auth{max-width:440px;margin:80px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:23px}.auth form{display:grid;gap:13px;margin-top:22px}.auth label{font-size:12px}.auth h1{font-size:23px}.auth p{font-size:12px;color:var(--muted);margin-top:9px}.post-review{display:grid;gap:14px}.post-review article{padding:20px;background:#fff;border:1px solid var(--line);border-radius:16px}.post-review h3{margin:8px 0}.post-review p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px}.post-review video{width:100%;max-width:500px;max-height:270px;background:#132e37;border-radius:12px;margin-bottom:12px}.post-review input{margin:12px 0}.meta{font-size:11px;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:15px}details{margin-top:14px}summary{cursor:pointer;color:var(--accent);font-size:12px}.permission-note{font-size:12px;color:var(--muted)}.preview-thumb{max-width:150px;max-height:100px;margin-top:10px;border-radius:10px}#top-error{padding:12px 30px;background:#fff0ec;color:#913a28;font-size:12px}#top-error:empty{display:none}.field-note{font-size:10px;color:var(--muted);display:block;margin-top:4px}
@media(max-width:1000px){.editor-layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{display:block}.sidebar{height:auto;position:static;padding:15px}.brand{font-size:17px}.brand-sub{margin-bottom:12px}.sidebar nav{display:flex;overflow:auto;gap:5px}.sidebar button{white-space:nowrap;padding:8px 11px}.sidebar a{display:none}.toolbar{padding:13px 16px}.toolbar b{font-size:12px}#main{padding:20px 16px 45px}.heading{align-items:flex-start}.heading h1{font-size:22px}.grid-form{grid-template-columns:1fr}.grid-form .wide{grid-column:auto}.panel{padding:16px}.stat{padding:15px}.stat strong{font-size:25px}.auth{margin:30px 16px;padding:25px}.toolbar span{max-width:145px}.table-wrap{max-width:100%}}
.list-tools{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:0 0 12px}.list-tools label{font-size:11px;color:var(--muted)}.list-search{flex:1;min-width:150px}.list-count{font-size:11px;color:var(--muted);padding-bottom:10px}.list-empty{padding:18px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:12px}.asset-preview{margin-top:10px}.asset-preview audio,.asset-preview video{width:100%;max-height:220px}.post-review article[hidden],tr[hidden],.list-empty[hidden]{display:none}@media(min-width:701px){.editor-layout #editor{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}} @font-face{font-family:EW-Tibetan;src:url(/assets/NotoSerifTibetan.woff2) format("woff2")}textarea[name$=Bo],textarea[name=bo],input[name$=Bo],input[name=bo]{font-family:EW-Tibetan,"Microsoft Himalaya",serif;line-height:2;font-size:17px}</style></head><body><div id="root"></div><div id="toast" class="notice" role="status" aria-live="polite"></div>
<script>
'use strict';
const el=document.getElementById('root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={dashboard:'运营概览',analytics:'数据中心',creators:'创作者管理',creatorReviews:'创作者内容审核',moderation:'审核规则与知识库',quotes:'首页轮播 / 每日一句',maps:'地图内容',cards:'抽卡卡池',music:'冥想音乐',courses:'智慧课程',courseCategories:'课程筛选项',teachers:'老师资料',devices:'设备供应商',signin:'签到音效',membership:'会员配置',benefits:'会员权益',posts:'普通社群审核',services:'服务需求',records:'签到与计时',revisions:'内容版本',audits:'操作日志',users:'账号与权限',settings:'AI与接口配置'};
const statuses={published:'已发布',pending:'待审核',rejected:'未通过',withdrawn:'已下架',draft:'草稿',archived:'已归档',accepted:'已受理',closed:'已结束',cancelled:'已取消'};
const roles={admin:'管理员',operator:'运营',reviewer:'审核员',teacher:'老师',user:'学员'};
const schemas={
 quotes:[['zh','轮播标题 / 每日一句','text'],['en','英文标题','text'],['bannerLabel','栏目标签（广告请填广告）','text'],['description','轮播说明','textarea'],['buttonLabel','跳转按钮文字','text'],['target','跳转：academy / dailyCard / music / body / mind / lifeResult / service / membership 或https网址；留空读思考','text'],['coverUrl','轮播图片','image']],
 maps:[['name','地图名称','text'],['heroTitle','主标题','text'],['heroText','一句简介','text'],['coverUrl','首页入口图片','image']],
 cards:[['zh','卡片名称','text'],['en','英文名称','text'],['coverUrl','卡面图片','image'],['lineZh','卡面寄语','textarea'],['readingZh','简短解读','textarea'],['actionZh','行动建议','textarea'],['symbol','图标','text'],['lineEn','英文寄语','textarea'],['readingEn','英文解读','textarea'],['actionEn','英文建议','textarea']],
 music:[['zh','音乐名称','text'],['en','英文名称','text'],['descZh','简短介绍','textarea'],['descEn','英文介绍','textarea'],['audioUrl','音频素材','audio']],
 courses:[['categoryIds','筛选分类（可多选）','categories'],['teacherId','所属老师','teacher'],['coverUrl','课程封面（建议4:3，支持图片上传）','image'],['zh','课程名称','text'],['en','英文名称','text'],['summaryZh','课程摘要','textarea'],['summaryEn','英文摘要','textarea'],['theme','主题','select:ziwei=认识自己,tcm=修复自己,healing=提升自己'],['format','形式','select:video=视频,audio=有声书,practice=短时练习'],['access','权益','select:public=非会员,member=会员'],['practice','关联练习','select:breath=一分钟呼吸,scan=身体觉察,ground=安住此刻,focus=专注,sleep=睡前放松,zen=静坐观息'],['goalsZh','学习目标 每行一项','lines'],['sections','章节导读 每段首行为标题 下一行为正文','chapters'],['mediaUrl','课程媒体','media'],['sources','参考出处 每行名称与HTTPS地址 用竖线分隔','sources']],
 courseCategories:[['name','筛选项名称','text'],['enabled','启用此筛选项','boolean']],
 teachers:[['verified','平台认证（仅管理员可修改）','certification'],['recommended','加入老师推荐（仅管理员可修改）','certification'],['coverUrl','老师头像','image'],['profileType','资料类型','select:real=真实资料,demo=示例资料'],['name','老师姓名','text'],['specialty','服务方向','text'],['bio','老师介绍','textarea']],
 devices:[['name','供应商名称','text'],['maps','适用地图','list'],['description','接入说明','textarea']],
 signin:[['name','签到名称','text'],['description','简短说明','textarea'],['audioUrl','签到钟声或铃声','audio']],
 membership:[['zh','套餐名称','text'],['en','英文名称','text'],['price','人民币价格','number'],['periodZh','计费周期','text'],['periodEn','英文周期','text'],['copyZh','权益简述','textarea'],['copyEn','英文权益简述','textarea']],
 benefits:[['zh','权益名称','text'],['en','英文名称','text'],['subZh','简短说明','text'],['subEn','英文说明','text'],['copyZh','权益内容','textarea'],['copyEn','英文内容','textarea'],['ctaZh','入口文字','text'],['ctaEn','英文入口','text'],['to','关联功能','select:memberContent=会员内容,service=AI服务,teachers=老师服务,community=社群,music=音乐,advancedPlan=修习方案,memberEvents=线下活动,memberGifts=会员礼包']]
};
const state={user:null,nav:'dashboard',items:[],editing:null,seq:0,authEpoch:0,resumeNav:null,settings:null,records:null};
let authStatusRevision=0,authStatusPending=null,authBusy=false;
function authChanged(){return Object.assign(Error('账号已变化，请重新读取。'),{code:'AUTH_CHANGED'});}
function authCurrent(epoch){return epoch===state.authEpoch;}
function allowedNavs(user=state.user){return Object.keys(labels).filter(k=>user?.role==='admin'||user?.role==='operator'&&!['users','settings','moderation'].includes(k)||user?.role==='reviewer'&&['dashboard','posts','audits','creators','creatorReviews'].includes(k));}
function invalidateAuth(preserveTarget=false){const target=preserveTarget?(state.resumeNav||state.nav):null;++state.authEpoch;++state.seq;++authStatusRevision;authStatusPending=null;Object.assign(state,{user:null,items:[],editing:null,settings:null,records:null,analytics:null,teacherOptions:[],categoryOptions:[],resumeNav:target});if(!preserveTarget)state.nav='dashboard';if(typeof caState!=='undefined')Object.assign(caState,{creators:[],teachers:[],works:[],selected:null,settings:null});}
function broadcastAuth(){try{localStorage.setItem('ew-identity-change-v1',Date.now()+'-'+Math.random());}catch{}}
function reconcileAuth(){invalidateAuth(true);broadcastAuth();authBootstrap();}
function requireLogin(){invalidateAuth(true);auth(false,'登录已失效，请重新登录后继续查看原页面。');}
function authConnectionError(message){el.innerHTML='<main class="auth"><h1>后台暂时无法连接</h1><p class="error" role="alert">'+esc(message)+'</p><button class="btn" data-action="auth-retry">重新连接</button><p><a href="/app">返回APP</a></p></main>';}
async function api(path,body,method){
 const epoch=state.authEpoch,verb=method||(body?'POST':'GET'),authWrite=verb!=='GET'&&path.startsWith('auth/'),controller=verb==='GET'?new AbortController():null,timer=controller?setTimeout(()=>controller.abort(),12000):null;
 try{const r=await fetch('/api/'+path,{method:verb,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,signal:controller?.signal});let d;try{d=await r.json();}catch(error){if(error.name==='AbortError')throw error;throw Error('服务返回了无法读取的内容，请重试。');}if(!authCurrent(epoch))throw authChanged();if(!r.ok){const error=Object.assign(Error(d.error||'操作失败'),{status:r.status});if(r.status===401&&!path.startsWith('auth/')){requireLogin();error.handled=true;}throw error;}return d;
 }catch(error){if(error.handled)throw error;if(!authCurrent(epoch))throw authChanged();if(error.name==='AbortError')throw Object.assign(Error('读取超时，请重试。'),{code:'READ_TIMEOUT'});if(error instanceof TypeError)throw Error('网络连接失败，请检查连接后重试。');throw error;}finally{if(timer)clearTimeout(timer);if(authWrite&&!authCurrent(epoch))reconcileAuth();}
}
async function authBootstrap(){
 if(authStatusPending)return authStatusPending;const epoch=state.authEpoch,revision=++authStatusRevision,active=()=>authCurrent(epoch)&&revision===authStatusRevision;el.innerHTML='<main class="auth"><h1>正在连接管理后台…</h1><p role="status">正在确认当前账号。</p></main>';
 const pending=(async()=>{try{const d=await api('auth/status');if(!active())return false;if(!d||typeof d.setupRequired!=='boolean'||!Object.hasOwn(d,'user')||d.user!==null&&(!d.user||typeof d.user.id!=='string'||!d.user.id.trim()||typeof d.user.role!=='string'))throw Error('账号状态响应异常，请重新连接。');state.user=d.user;if(state.user&&['admin','operator','reviewer'].includes(state.user.role))shell();else auth(d.setupRequired,state.user?'当前账号没有后台管理权限。':'');return true;}catch(error){if(!active()||error.code==='AUTH_CHANGED')return false;if(error.status===401)requireLogin();else authConnectionError(error.message);return false;}finally{if(active())authStatusPending=null;}})();authStatusPending=pending;return pending;
}
function toast(message){const node=document.getElementById('toast');node.textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.textContent='',4200);}
function showError(err){if(err.handled||err.code==='AUTH_CHANGED')return;const node=document.getElementById('top-error');if(node)node.textContent=err.message;else toast(err.message);}
function badge(status){return `<span class="badge ${esc(status)}">${esc(statuses[status]||status)}</span>`;}
function date(value){return new Date(value).toLocaleString('zh-CN',{hour12:false});}
function auth(setup=false,message=''){el.innerHTML=`<main class="auth"><h1>${setup?'创建首位管理员':'登录管理后台'}</h1><p>${setup?'设置你自己的管理账号，后续可分配运营、审核和老师权限。':'东方智慧内容、社群与服务统一管理。'}</p><form id="auth-form" data-mode="${setup?'setup':'login'}"><label>账号<input name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" placeholder="3–32位字母、数字或下划线" required></label><label>密码<input name="password" type="password" autocomplete="${setup?'new-password':'current-password'}" minlength="${setup?10:1}" maxlength="128" required></label>${setup?'<label>管理昵称<input name="name" maxlength="24" required></label>':''}<button class="btn">${setup?'创建并进入':'登录'}</button><p id="auth-error" class="error" role="alert">${esc(message)}</p></form><p><a href="/app">返回APP</a></p></main>`;}
function shell(){const allowed=allowedNavs(),requested=state.resumeNav||'dashboard',target=allowed.includes(requested)?requested:'dashboard',denied=target!==requested;state.resumeNav=null;el.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">东方智慧</div><div class="brand-sub">OPERATIONS CONSOLE</div><nav aria-label="后台模块">${allowed.map(k=>`<button data-nav="${k}">${labels[k]}</button>`).join('')}</nav><a href="/creator" target="_blank" rel="noopener">打开创作者中心 ↗</a><a href="/app" target="_blank" rel="noopener">打开APP查看效果 ↗</a></aside><div class="workspace"><header class="toolbar"><b>统一管理后台</b><div class="actions"><span>${esc(state.user.name)} · ${roles[state.user.role]}</span><button class="btn secondary small" data-action="logout">退出</button></div></header><p id="top-error" role="alert"></p><main id="main"></main></div></div>`;load(target);if(denied)document.getElementById('top-error').textContent='当前账号没有原页面权限，已返回运营概览。';}
function heading(name,action=''){return `<div class="heading"><h1>${name}</h1>${action}</div>`;}
function table(headers,rows){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无记录</div>';}
async function load(nav){if(!state.user||!document.getElementById('main'))return false;const seq=++state.seq;state.nav=nav;state.editing=null;document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.nav===nav?'page':'false')));document.getElementById('top-error').textContent='';const main=document.getElementById('main');main.innerHTML='<p class="hint">正在读取…</p>';try{
 if(['creators','creatorReviews','moderation'].includes(nav)){await loadCreatorAdmin(nav,seq);}
 else if(nav==='analytics'){await loadAnalyticsAdmin(seq);}

 else if(nav==='dashboard'){const d=await api('admin/dashboard');if(seq!==state.seq)return;main.innerHTML=heading('运营概览')+`<div class="stats">${[['users','账号'],['content','内容条目'],['pending','待审核'],['posts','社群发布'],['services','服务需求'],['records','签到与觉察记录'],['devices','设备授权']].map(([k,name])=>`<div class="stat"><strong>${d.counts[k]||0}</strong><span>${name}</span></div>`).join('')}</div><section class="panel"><h2>日常工作</h2><p class="hint">内容编辑、社群审核、角色权限、计时记录、AI及设备接口配置集中维护。内容发布后，APP重新打开即可读取。</p><div class="actions"><button class="btn" data-nav="posts">处理待审核内容</button>${state.user.role!=='reviewer'?'<button class="btn secondary" data-nav="courses">管理课程与素材</button><button class="btn secondary" data-nav="services">处理服务需求</button><button class="btn secondary" data-nav="records">查询签到与计时</button>':''}</div></section>`;}

document.addEventListener('change',async e=>{const fileInput=e.target.closest('[data-upload]');if(!fileInput||!fileInput.files[0])return;const file=fileInput.files[0],epoch=state.authEpoch,form=fileInput.closest('form');try{if(file.size>50*1024*1024)throw Error('文件不能超过50MB。');fileInput.disabled=true;let mime=file.type==='audio/x-wav'?'audio/wav':file.type;const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':mime,'X-Filename':encodeURIComponent(file.name)},body:file});const d=await r.json();if(!authCurrent(epoch)||!fileInput.isConnected||!form?.isConnected)return;if(!r.ok){const error=Object.assign(Error(d.error||'上传失败'),{status:r.status});if(r.status===401){requireLogin();error.handled=true;}throw error;}const field=form.querySelector(`[name="${fileInput.dataset.upload}"]`);if(!field)return;field.value=d.url;field.closest('label').querySelector('.asset-preview')?.remove();field.closest('label').insertAdjacentHTML('beforeend',mediaPreview(d.mime?.startsWith('image/')?'image':d.mime?.startsWith('audio/')?'audio':'media',d.url));toast('素材已上传，请保存或发布内容。');}catch(err){if(authCurrent(epoch)&&fileInput.isConnected)showError(err);}finally{if(authCurrent(epoch)&&fileInput.isConnected)fileInput.disabled=false;}});
